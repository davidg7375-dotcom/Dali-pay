name: Preview Screens

# מריץ את האפליקציה בדפדפן עם נתוני דמה ומצלם את כל המסכים (לבדיקות עיצוב). לא נוגע בנתונים אמיתיים.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx expo install babel-preset-expo
      - run: npx expo install react-native-web react-dom @expo/metro-runtime
      - run: npx expo install --fix
      - name: בניית גרסת web עם נתוני דמה
        env:
          DALI_PREVIEW: '1'
          EXPO_PUBLIC_SUPABASE_URL: https://preview.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: preview
        run: npx expo export --platform web --output-dir web-dist
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: צילום המסכים
        run: |
          python3 -m http.server 8081 -d web-dist >/dev/null 2>&1 &
          sleep 2
          node preview/shoot.mjs http://localhost:8081/ screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: screens
      - name: שמירת הצילומים בענף preview-shots (לצפייה)
        if: always()
        run: |
          cp -r screens "$RUNNER_TEMP/screens"
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout --orphan preview-shots
          git rm -rf . >/dev/null 2>&1 || true
          cp -r "$RUNNER_TEMP/screens/." .
          git add -A
          git commit -qm "צילומי מסך מהתצוגה המקדימה"
          git push -f origin preview-shots
