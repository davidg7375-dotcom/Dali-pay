<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3b2bd6">
<title>DALI PAY</title>
<style>
:root{
  --y1:#ffe55c;--y2:#ffb800;--p1:#7c4dff;--p2:#4a2bd6;--b1:#3aa8ff;--b2:#6a5cff;
  --ink:#1c1450;--glass:rgba(255,255,255,.16);--green:#19c37d;--red:#ff4d6d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:"Rubik","Heebo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#fff;background:linear-gradient(170deg,#38b6ff 0%,#6a5cff 45%,#8a3cff 100%) fixed;
  overflow-x:hidden;-webkit-user-select:none;user-select:none;
}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;z-index:0;pointer-events:none}
body:before{width:260px;height:260px;background:#00e0ff;top:-60px;left:-80px;animation:drift 9s ease-in-out infinite alternate}
body:after{width:300px;height:300px;background:#ff5de0;bottom:-100px;right:-100px;animation:drift 11s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(40px,30px) scale(1.15)}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  background:linear-gradient(170deg,#38b6ff,#6a5cff 50%,#8a3cff);transition:opacity .7s ease,visibility 0s .7s}
#splash .sbg{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(28px) saturate(1.3);opacity:.55;transform:scale(1.1);animation:sbg 6s ease-in-out infinite alternate}
@keyframes sbg{to{transform:scale(1.22) rotate(2deg)}}
#splash .rays{position:absolute;width:170vmax;height:170vmax;left:50%;top:44%;margin:-85vmax 0 0 -85vmax;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.16) 0 8deg,rgba(255,255,255,0) 8deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#splash .shero{position:relative;width:min(94vw,74vh);aspect-ratio:1;border-radius:36px;box-shadow:0 30px 80px rgba(30,10,120,.6),0 0 0 4px rgba(255,255,255,.45),0 0 60px rgba(120,240,255,.55);
  animation:heroIn 1.1s cubic-bezier(.18,1.3,.4,1) both,float 4.5s ease-in-out 1.1s infinite}
@keyframes heroIn{0%{transform:perspective(900px) scale(.55) rotateX(18deg) rotate(-6deg);opacity:0;filter:blur(8px)}60%{opacity:1;filter:blur(0)}100%{transform:none}}
#splash .tw{position:absolute;color:#fff;font-size:22px;text-shadow:0 0 12px #fff,0 0 24px #9ff;opacity:0;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(90deg)}}
#splash p{position:relative;margin:22px 0 0;font-weight:900;font-size:16px;letter-spacing:.3px;text-shadow:0 2px 8px rgba(30,10,120,.5);animation:rise .8s .5s both}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
#splash.out .shero{animation:heroOut .7s cubic-bezier(.5,0,.75,0) both}
@keyframes heroOut{to{transform:scale(1.25) translateY(-30px);opacity:0;filter:blur(6px)}}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
@keyframes float{50%{transform:translateY(-8px)}}
.dots{position:relative;display:flex;gap:7px;margin-top:12px}
.dots i{width:9px;height:9px;border-radius:50%;background:#fff;opacity:.4;animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:1;transform:translateY(-4px)}}

/* ---------- layout ---------- */
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 110px)}
.banner{position:relative;border-radius:26px;overflow:hidden;box-shadow:0 10px 30px rgba(30,10,120,.4),0 0 0 3px rgba(255,255,255,.4)}
#app>*{opacity:0}
#app.show>*{animation:enter .75s cubic-bezier(.2,1.1,.3,1) both}
#app.show>:nth-child(2){animation-delay:.08s}#app.show>:nth-child(3){animation-delay:.16s}#app.show>:nth-child(4){animation-delay:.22s}#app.show>:nth-child(n+5){animation-delay:.28s}
@keyframes enter{from{opacity:0;transform:translateY(34px) scale(.96)}to{opacity:1;transform:none}}
.banner img{display:block;width:100%;height:auto}
.who{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.88);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:800;font-size:12px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
@keyframes rise{from{transform:translateY(18px);opacity:0}}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.stat{position:relative;border-radius:24px;overflow:hidden;min-height:128px;padding:14px 14px 12px;color:#fff;isolation:isolate;
  display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 12px 26px rgba(30,10,120,.32),inset 0 0 0 2px rgba(255,255,255,.35)}
.stat.owe{background:linear-gradient(145deg,#ff9a8b 0%,#ff4f81 45%,#c81d77 100%);box-shadow:0 12px 26px rgba(200,29,119,.38),inset 0 0 0 2px rgba(255,255,255,.4)}
.stat.owed{background:linear-gradient(145deg,#7cf5d0 0%,#14c6a0 45%,#0b8bb0 100%);box-shadow:0 12px 26px rgba(11,139,176,.38),inset 0 0 0 2px rgba(255,255,255,.4)}
.stat:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.16);top:-60px;left:-50px;z-index:-1}
.stat:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.12);bottom:-34px;right:-20px;z-index:-1}
.stat .shine{position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 48%,transparent 66%);transform:translateX(-120%);animation:shine 7s ease-in-out 2s infinite}
.stat.owed .shine{animation-delay:3.2s}
@keyframes shine{0%,72%{transform:translateX(-120%)}90%,100%{transform:translateX(120%)}}
.stat .top{display:flex;align-items:center;gap:8px}
.stat .ico{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:18px;font-weight:900;background:rgba(255,255,255,.28);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.stat small{display:block;font-weight:800;font-size:14px;letter-spacing:.2px;opacity:.97}
.stat b{display:block;font-size:34px;font-weight:900;line-height:1;letter-spacing:-.5px;text-shadow:0 3px 10px rgba(60,0,60,.25);direction:ltr;text-align:right;white-space:nowrap}
.stat.bump{animation:bump .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.06)}}
.stat.total{grid-column:1/-1;min-height:84px;flex-direction:row;align-items:center;background:linear-gradient(100deg,#fff07a,#ffd02a 50%,#ffae00);color:var(--ink);box-shadow:0 10px 22px rgba(255,170,0,.42),inset 0 0 0 2px rgba(255,255,255,.75)}
.stat.total:before{background:rgba(255,255,255,.3)}
.stat.total b{font-size:32px;text-shadow:none}
.stat.total small{font-size:14px;margin-bottom:4px}
.stat.total .coin{font-size:36px;animation:coin 3.2s ease-in-out infinite}
@keyframes coin{0%,100%{transform:translateY(0) rotateY(0)}50%{transform:translateY(-6px) rotateY(180deg)}}
.pos{color:#0b7d4d}.neg{color:#c01540}

.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.big .tile{height:92px!important}
.big{position:relative;border-radius:22px;padding:0;overflow:hidden;background:linear-gradient(180deg,#fff7b0,#ffd23a 55%,#ffb300);
  color:var(--ink);font-weight:900;font-size:14px;box-shadow:0 7px 0 #c98400,0 14px 22px rgba(30,10,120,.35);transition:transform .12s,box-shadow .12s}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 #c98400,0 6px 10px rgba(30,10,120,.3)}
.big .tile{height:74px;background-size:100% auto;background-position:top;border-bottom:3px solid #ffb300}
.big span{display:block;padding:8px 2px 10px}

h2{display:flex;align-items:center;gap:8px;margin:22px 4px 10px;font-size:18px;font-weight:900;text-shadow:0 2px 6px rgba(30,10,120,.4)}
h2 .ic{width:34px;height:34px;border-radius:10px;background-size:cover;background-position:top;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
h2 em{margin-inline-start:auto;font-style:normal;font-size:12px;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:999px}

.card{background:rgba(255,255,255,.95);color:var(--ink);border-radius:20px;padding:13px 14px;margin-bottom:10px;box-shadow:0 8px 18px rgba(30,10,120,.28);animation:rise .4s both;position:relative;overflow:hidden}
.card:active{transform:scale(.985)}
.row{display:flex;align-items:center;gap:10px}
.dir{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.dir.in{background:linear-gradient(135deg,#b6ffdf,#19c37d)}
.dir.out{background:linear-gradient(135deg,#ffc2cf,#ff4d6d)}
.grow{flex:1;min-width:0}
.t{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:12px;opacity:.65;margin-top:2px;font-weight:600}
.amt{font-weight:900;font-size:18px;text-align:left;direction:ltr}
.amt.in{color:#0b9a63}.amt.out{color:#e0294d}
.bar{height:7px;border-radius:9px;background:#e8e4ff;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#7c4dff,#3aa8ff);transition:width .5s}
.badge{font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px;background:#efeaff;color:#5a37d9}
.badge.ok{background:#d8ffec;color:#0b7d4d}

.empty{text-align:center;color:#fff}
.empty .pic{width:150px;aspect-ratio:203/150;margin:4px auto 6px;border-radius:20px;background-size:100% auto;background-position:top;box-shadow:0 0 0 3px rgba(255,255,255,.5),0 10px 20px rgba(30,10,120,.35);animation:float 4s ease-in-out infinite}
.empty b{display:block;font-weight:900;font-size:16px}
.empty span{font-size:13px;opacity:.85}

.notes{display:flex;gap:10px;overflow-x:auto;padding:18px 6px 14px;margin-top:4px;scroll-snap-type:x mandatory}
.notes::-webkit-scrollbar{display:none}
.note{flex:none;width:170px;scroll-snap-align:start;border-radius:6px 6px 22px 6px;padding:14px 13px 12px;color:var(--ink);font-weight:800;font-size:14px;line-height:1.35;box-shadow:0 10px 18px rgba(30,10,120,.35);transform:rotate(-2deg);position:relative;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;animation:rise .4s both}
.note:nth-child(2n){transform:rotate(2deg)}
.note .pin{position:absolute;top:-8px;left:50%;margin-left:-11px;font-size:22px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.note small{font-size:11px;opacity:.6;margin-top:8px}
.n0{background:#fff176}.n1{background:#ffb4e1}.n2{background:#aef0ff}.n3{background:#c8ffb0}

/* ---------- sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(15,5,60,.55);backdrop-filter:blur(4px);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:520px;margin:0 auto;background:linear-gradient(180deg,#fff,#efeaff);color:var(--ink);
  border-radius:30px 30px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);max-height:90vh;overflow:auto;box-shadow:0 -10px 40px rgba(30,10,120,.4)}
#sheet.on{transform:none}
#sheet .grab{width:48px;height:5px;border-radius:9px;background:#cfc6ff;margin:0 auto 12px}
#sheet .hd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
#sheet .hd .pic{width:74px;aspect-ratio:203/150;border-radius:14px;background-size:100% auto;background-position:top;box-shadow:0 4px 10px rgba(30,10,120,.3);flex:none}
#sheet h3{margin:0;font-size:20px;font-weight:900}
label{display:block;font-weight:800;font-size:13px;margin:12px 2px 6px}
.inp{width:100%;border:2px solid #d9d0ff;background:#fff;border-radius:16px;padding:13px 14px;font-size:17px;font-weight:700;color:var(--ink);outline:0;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:var(--p1);box-shadow:0 0 0 4px rgba(124,77,255,.18)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border-radius:16px;padding:13px 6px;font-weight:900;font-size:14px;background:#fff;border:2px solid #d9d0ff;color:#5a37d9;transition:.15s}
.seg button.on{background:linear-gradient(135deg,#7c4dff,#3aa8ff);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(124,77,255,.4)}
.cta{width:100%;margin-top:18px;border-radius:20px;padding:16px;font-weight:900;font-size:18px;color:var(--ink);background:linear-gradient(180deg,#fff7b0,#ffd23a 55%,#ffb300);box-shadow:0 6px 0 #c98400,0 12px 20px rgba(255,170,0,.4)}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #c98400}
.cta.ghost{background:#fff;box-shadow:0 0 0 2px #d9d0ff;color:#5a37d9;margin-top:10px}
.cta.danger{background:linear-gradient(180deg,#ff8aa0,#ff4d6d);color:#fff;box-shadow:0 6px 0 #b8203f}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.colors{display:flex;gap:10px}
.colors button{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.7),0 3px 8px rgba(0,0,0,.2)}
.colors button.on{outline:3px solid var(--p1);outline-offset:2px}
.hist{margin-top:10px;font-size:13px;font-weight:700;opacity:.8}
.hist div{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px dashed #d9d0ff}


#who{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:linear-gradient(170deg,rgba(56,182,255,.96),rgba(138,60,255,.97));text-align:center}
#who.on{display:flex}
#who h1{margin:0 0 6px;font-size:26px;font-weight:900}
#who .pick{width:min(80vw,300px);border-radius:24px;padding:18px;font-size:22px;font-weight:900;color:var(--ink);background:linear-gradient(180deg,#fff7b0,#ffd23a 55%,#ffb300);box-shadow:0 7px 0 #c98400,0 14px 22px rgba(30,10,120,.4)}
.mini{font-size:12px;opacity:.85;margin-top:12px}

/* ---------- gate (login / group) ---------- */
#gate{position:fixed;inset:0;z-index:45;display:none;overflow:auto;background:linear-gradient(170deg,#38b6ff 0%,#6a5cff 45%,#8a3cff 100%)}
#gate.on{display:block}
#gate .gbox{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 18px 40px}
#gate .ghero{display:block;width:min(70vw,260px);aspect-ratio:1;margin:0 auto 16px;border-radius:30px;box-shadow:0 14px 40px rgba(30,10,120,.5),0 0 0 3px rgba(255,255,255,.4)}
#gate .card{padding:18px}
#gate label{margin-top:4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#b9b0e8;margin-inline-start:6px;vertical-align:1px}
.dot.ok{background:#19c37d;box-shadow:0 0 0 3px rgba(25,195,125,.25)}.dot.bad{background:#ff4d6d;box-shadow:0 0 0 3px rgba(255,77,109,.25)}
.invite{border:2px dashed #7c4dff}
button:disabled{cursor:default}
#upd{position:fixed;inset:0;z-index:58;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(15,5,60,.6);backdrop-filter:blur(4px)}
#upd.on{display:flex;animation:fadeIn .3s ease both}
#upd .ubox{width:min(100%,380px);background:linear-gradient(180deg,#fff,#efeaff);color:var(--ink);border-radius:28px;padding:22px 20px 18px;text-align:center;box-shadow:0 20px 50px rgba(30,10,120,.5);animation:enter .6s cubic-bezier(.2,1.3,.4,1) both}
#upd .ulogo{width:96px;height:96px;margin:0 auto 10px;border-radius:24px;background-size:cover;animation:float 3s ease-in-out infinite}
#upd b{display:block;font-size:22px;font-weight:900}
#upd .uhelp{margin-top:12px;font-size:13px;font-weight:700;line-height:1.45;text-align:right;color:#4b3f8a}
#upd .uhelp:empty{display:none}
.spin{display:inline-block;width:16px;height:16px;border:3px solid rgba(28,20,80,.25);border-top-color:#1c1450;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-inline-end:8px}
/* top banner (main image + caption) */
.banner .top{display:block;width:100%;aspect-ratio:1000/638;object-fit:cover;animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.06) translate(-1%,1%)}}
.banner .cap{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);white-space:nowrap;padding:10px 22px;border-radius:999px;font-weight:900;font-style:italic;font-size:21px;color:#2a0e7a;
  background:linear-gradient(180deg,#fff6a8,#ffd52e 55%,#ffb000);box-shadow:0 6px 0 #c98400,0 12px 24px rgba(30,10,120,.45),inset 0 0 0 2px rgba(255,255,255,.7);animation:capIn .9s cubic-bezier(.2,1.5,.4,1) .5s both}
@keyframes capIn{from{transform:translateX(-50%) scale(.4);opacity:0}}
.hist-btn{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.88);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:800;font-size:12px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
/* avatars in stat cards */
.stat .av{position:absolute;left:10px;top:10px;width:62px;height:62px;border-radius:50%;background-size:cover;background-position:center;
  box-shadow:0 0 0 3px #fff,0 6px 14px rgba(40,0,60,.35);animation:bob 3.6s ease-in-out infinite;z-index:1}
.stat.owed .av{animation-delay:1.2s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-3deg)}}
.av.jump{animation:jump .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{30%{transform:translateY(-16px) scale(1.12) rotate(-8deg)}60%{transform:translateY(0) scale(.95) rotate(4deg)}}
.av.shake{animation:shake .7s ease-in-out}
@keyframes shake{20%,60%{transform:translateX(-6px) rotate(-8deg)}40%,80%{transform:translateX(6px) rotate(8deg)}}
.av.spin{animation:spinav .9s cubic-bezier(.3,1.3,.5,1)}
@keyframes spinav{to{transform:rotate(360deg) scale(1)}50%{transform:rotate(180deg) scale(1.2)}}
.bub{position:absolute;left:44px;top:0;font-size:26px;z-index:3;pointer-events:none;animation:bub 1.5s ease-out forwards;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
@keyframes bub{0%{transform:translateY(10px) scale(.2);opacity:0}25%{transform:translateY(-14px) scale(1.25);opacity:1}100%{transform:translateY(-46px) scale(1);opacity:0}}
.stat .top{padding-inline-end:66px}
.stat small{white-space:nowrap;font-size:16px!important}
/* pin-note banner */
.pinbar{position:relative;display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;padding:14px 16px;border-radius:22px;text-align:right;color:#4a0b4f;overflow:hidden;
  background:linear-gradient(110deg,#ffd6f1 0%,#ffb3d9 30%,#ffc98a 70%,#fff08a 100%);box-shadow:0 10px 22px rgba(255,90,170,.35),inset 0 0 0 2px rgba(255,255,255,.75);transform:rotate(-1deg)}
.pinbar:before{content:"";position:absolute;inset:5px;border-radius:18px;border:2px dashed rgba(160,40,140,.28);pointer-events:none}
.pinbar:active{transform:rotate(-1deg) scale(.97)}
.pinbar .pn{font-size:34px;animation:pinw 2.6s ease-in-out infinite;transform-origin:70% 90%;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
@keyframes pinw{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg) translateY(-3px)}}
.pinbar b{display:block;font-size:20px;font-weight:900}.pinbar small{display:block;font-size:12px;font-weight:700;opacity:.75}
.pinbar .minis{margin-inline-start:auto;position:relative;width:74px;height:54px;flex:none}
.pinbar .minis i{position:absolute;width:40px;height:40px;border-radius:4px 4px 12px 4px;box-shadow:0 4px 8px rgba(0,0,0,.18)}
.pinbar .minis i:nth-child(1){left:0;top:8px;background:#fff176;transform:rotate(-12deg)}
.pinbar .minis i:nth-child(2){left:18px;top:2px;background:#aef0ff;transform:rotate(6deg);animation:mini 3s ease-in-out infinite}
.pinbar .minis i:nth-child(3){left:34px;top:10px;background:#c8ffb0;transform:rotate(16deg)}
@keyframes mini{50%{transform:rotate(-4deg) translateY(-4px)}}
.pinbar.hop .pn{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
/* avatar picker */
#pick{position:fixed;inset:0;z-index:48;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;text-align:center;
  background:linear-gradient(170deg,rgba(56,182,255,.97),rgba(138,60,255,.98))}
#pick.on{display:flex;animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0}}
#pick h1{margin:0;font-size:26px;font-weight:900;text-shadow:0 3px 10px rgba(30,10,120,.4);animation:enter .6s both}
#pick p{margin:6px 0 18px;font-weight:700;opacity:.9}
#pick .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(100%,460px)}
#pick .opt{border-radius:24px;overflow:hidden;background:#fff;color:var(--ink);font-weight:900;font-size:16px;box-shadow:0 12px 26px rgba(30,10,120,.4);animation:enter .7s cubic-bezier(.2,1.3,.4,1) both;transition:transform .2s}
#pick .opt:nth-child(2){animation-delay:.12s}
#pick .opt .ph{aspect-ratio:1;background-size:cover;background-position:top}
#pick .opt span{display:block;padding:10px 4px 12px}
#pick .opt.sel{transform:scale(1.06);box-shadow:0 0 0 5px #ffd52e,0 16px 30px rgba(30,10,120,.5)}
#pick .opt.dim{opacity:.35;transform:scale(.94)}
#pick .opt[disabled]{opacity:.45}
/* reports / bit */
.badge.warn{background:#fff1c2;color:#8a5a00}
.paybox{background:linear-gradient(135deg,#eaf6ff,#f1e9ff);border-radius:18px;padding:12px 14px;margin-top:12px}
.paybox .big2{font-size:30px;font-weight:900;direction:ltr;text-align:right;color:#4a2bd6}
.cta.bit{background:linear-gradient(180deg,#5fe0ff,#1ea0ff 60%,#0a6fe0);color:#fff;box-shadow:0 6px 0 #0750a8,0 12px 20px rgba(10,111,224,.35)}
.rep{display:flex;align-items:center;gap:8px;background:#fff8dc;border-radius:14px;padding:10px 12px;margin-top:10px;font-weight:800;font-size:14px}
.rep .grow{white-space:normal}
.rep button{border-radius:12px;padding:8px 12px;font-weight:900;font-size:13px}
.rep .yes{background:#19c37d;color:#fff}.rep .no{background:#ffe1e7;color:#c01540}
.lock{font-size:12px;font-weight:800;color:#6b5fb0;margin-top:10px}
/* history */
.hday{font-size:12px;font-weight:900;color:#6b5fb0;margin:14px 2px 6px}
.hrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed #e2dcff;animation:rise .35s both}
.hrow .hi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:none;background:#f1ecff}
.hrow .ht{font-weight:800;font-size:14px;line-height:1.35}
.hrow .hs{font-size:12px;opacity:.6;font-weight:700;margin-top:2px}
.card,.cta,.note,.who,.seg button,.colors button{transition:transform .16s cubic-bezier(.3,1.5,.5,1)}
.card:active,.note:active{transform:scale(.97)}
.cta:active{transform:translateY(4px) scale(.98)}
.big .tile{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.big:active .tile{transform:scale(1.08) rotate(-2deg)}
.big.hop .tile{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{30%{transform:translateY(-6px) scale(1.06) rotate(-3deg)}60%{transform:rotate(2deg)}}
#sheet.on .hd .pic{animation:charIn .7s cubic-bezier(.2,1.6,.4,1) .12s both,wob 3.5s ease-in-out .9s infinite}
@keyframes charIn{from{transform:scale(.3) rotate(-14deg);opacity:0}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg) translateY(-2px)}75%{transform:rotate(3deg)}}
.card.fresh{animation:fresh .9s cubic-bezier(.2,1.3,.4,1) both}
@keyframes fresh{0%{transform:translateX(40px) scale(.9);opacity:0}60%{box-shadow:0 0 0 4px rgba(255,214,58,.9),0 8px 18px rgba(30,10,120,.28)}100%{transform:none;opacity:1}}
.fx{position:fixed;z-index:70;pointer-events:none;font-size:26px;left:0;top:0;will-change:transform,opacity}
#cele{position:fixed;inset:0;z-index:65;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s}
#cele.on{opacity:1}
#cele .cpic{width:min(62vw,250px);aspect-ratio:203/150;border-radius:26px;background-size:100% auto;background-position:top;box-shadow:0 18px 50px rgba(30,10,120,.55),0 0 0 4px #fff}
#cele.on .cpic{animation:celeIn .8s cubic-bezier(.2,1.6,.4,1) both,wob 1.2s ease-in-out .8s}
#cele b{margin-top:14px;font-size:24px;font-weight:900;text-shadow:0 3px 12px rgba(30,10,120,.6)}
#cele.on b{animation:celeIn .7s cubic-bezier(.2,1.6,.4,1) .15s both}
@keyframes celeIn{from{transform:scale(.2) rotate(-12deg);opacity:0}}
#gate{transition:opacity .45s ease,transform .45s ease}
#gate.leave{opacity:0;transform:translateY(-24px) scale(1.02)}
#gate.on .card{animation:enter .7s cubic-bezier(.2,1.1,.3,1) .1s both}
#gate.on .ghero{animation:heroIn .9s cubic-bezier(.18,1.3,.4,1) both,float 4.5s ease-in-out 1s infinite}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="splash"><div class="sbg" data-bg="hero"></div><div class="rays"></div><span class="tw" style="top:12%;left:14%">✦</span><span class="tw" style="top:18%;right:12%;animation-delay:.7s">✦</span><span class="tw" style="bottom:22%;left:10%;animation-delay:1.3s;font-size:16px">✦</span><span class="tw" style="bottom:16%;right:16%;animation-delay:.35s;font-size:28px">✦</span><span class="tw" style="top:8%;left:52%;animation-delay:1.8s;font-size:14px">✦</span><img class="shero" data-src="hero" alt="DALI PAY"><p>טוען את החשבונות…</p><div class="dots"><i></i><i></i><i></i></div></div>

<div id="gate"><div class="gbox"><img class="ghero" data-src="hero" alt=""><div class="card" id="gateCard"></div></div></div>

<div id="app">
  <div class="banner"><img class="top" data-src="top" alt="DALI PAY"><span class="cap">ניהול חובות ומוצרים!</span><button class="who" id="whoBtn"></button><button class="hist-btn" id="histBtn">🕘 היסטוריה</button></div>

  <div class="stats">
    <div class="stat owe" id="cOwe"><i class="shine"></i><div class="av" id="avMe"></div><div class="top"><small>אני חייב</small></div><b id="sIowe">₪0</b></div>
    <div class="stat owed" id="cOwed"><i class="shine"></i><div class="av" id="avOther"></div><div class="top"><small>חייבים לי</small></div><b id="sOwed">₪0</b></div>
    <div class="stat total" id="cBal"><div style="flex:1"><small>יתרה כוללת</small><b id="sBal">₪0</b></div><span class="coin">🪙</span></div>
  </div>

  <div class="actions">
    <button class="big" id="bDebt"><div class="tile" data-bg="opendebt"></div><span>הוסף חוב</span></button>
    <button class="big" id="bProd"><div class="tile" data-bg="addprod"></div><span>הוסף מוצר</span></button>
  </div>

  <button class="pinbar" id="bNote"><span class="pn">📌</span><div><b>נעץ פתק</b><small>תודה, תזכורת או סתם חיוך</small></div><span class="minis"><i></i><i></i><i></i></span></button>

  <div id="notesWrap"></div>

  <h2><span class="ic" data-bg="opendebt"></span>חובות פתוחים<em id="cDebts">0</em></h2>
  <div id="debts"></div>

  <h2><span class="ic" data-bg="prodlist"></span>מוצרים בדרך<em id="cProds">0</em></h2>
  <div id="prods"></div>
</div>

<div id="scrim"></div>
<div id="sheet"></div>
<div id="upd"><div class="ubox"><div class="ulogo" data-bg="logo"></div><b>גרסה חדשה זמינה</b><div class="s" id="uVer" style="margin-top:4px"></div><button class="cta" id="uGo">עדכן עכשיו</button><button class="cta ghost" id="uLater">אחר כך</button><div class="uhelp" id="uHelp"></div></div></div>
<div id="pick"><h1>מי אתה מהשניים?</h1><p>בחר את הדמות שלך. השני יקבל את הדמות השנייה אוטומטית.</p><div class="opts"><button class="opt" data-av="a"><div class="ph" data-bg="char_a"></div><span>זה אני</span></button><button class="opt" data-av="b"><div class="ph" data-bg="char_b"></div><span>זה אני</span></button></div></div>
<div id="cele"><div class="cpic"></div><b></b></div>


<script>
(function(){
'use strict';
var IMG=/*IMGMAP*/{};
var HIDE_KEY='dalipay.hidden.notes', CACHE_PREFIX='dalipay.cache.';
var S={fresh:{},uid:null,email:null,mem:null,members:[],debts:[],pays:[],prods:[],msgs:[],sync:null};

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function r2(n){return Math.round((Number(n)+Number.EPSILON)*100)/100}
function money(n){n=r2(n);return '₪'+n.toLocaleString('he-IL',{maximumFractionDigits:2})}
function pad(n){return ('0'+n).slice(-2)}
function ymd(iso){var d=iso?new Date(iso):new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fdate(iso){if(!iso)return '';var d=new Date(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2)}
function img(n){return 'var(--i-'+n+')'}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
Object.keys(IMG).forEach(function(k){document.documentElement.style.setProperty('--i-'+k,'url('+IMG[k]+')')});
[].forEach.call(document.querySelectorAll('[data-bg]'),function(e){e.style.backgroundImage=img(e.getAttribute('data-bg'))});
[].forEach.call(document.querySelectorAll('[data-src]'),function(e){e.src=IMG[e.getAttribute('data-src')]||''});

/* ---------- bridge to native ---------- */
var pend={},seq=0;
function call(op,args,ms){
  return new Promise(function(res,rej){
    if(!window.ReactNativeWebView)return rej(new Error('נא לפתוח את DALI PAY מתוך האפליקציה במכשיר'));
    var id=++seq,t=setTimeout(function(){delete pend[id];rej(new Error('אין תגובה מהשרת. בדוק חיבור לאינטרנט'))},ms||20000);
    pend[id]={res:res,rej:rej,t:t};
    window.ReactNativeWebView.postMessage(JSON.stringify({id:id,op:op,args:args||{}}));
  });
}
window.__fromNative=function(m){
  if(typeof m==='string')m=JSON.parse(m);
  if(m.event==='changed'){queueLoad();return}
  if(m.event==='back'){onBack();return}
  if(m.event==='resume'){queueLoad();checkForUpdate();return}
  var p=pend[m.id];if(!p)return;clearTimeout(p.t);delete pend[m.id];
  if(m.ok)p.res(m.result);else p.rej(new Error(m.error||'שגיאה'));
};
function onBack(){
  if($('upd').classList.contains('on')){$('upd').classList.remove('on');updDismissed=true;return}
  if($('sheet').classList.contains('on')){closeSheet();return}
  call('exit',{}).catch(function(){});
}

/* ---------- toast / sheet ---------- */
function toast(msg){call('notify',{text:String(msg)}).catch(function(){})}
/* ---------- motion & effects ---------- */
var RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function countTo(el,val,fmt){
  var from=el._v==null?0:el._v,first=el._v==null;el._v=val;
  if(!first&&from!==val){var c=el.closest('.stat');if(c){c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')}}
  if(RM||from===val){el.textContent=fmt(val);return}
  var t0=performance.now(),d=first?1100:700;
  (function f(t){var k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=fmt(k<1?from+(val-from)*e:val);if(k<1)requestAnimationFrame(f)})(t0);
}
var FX={debt:['💸','🪙','💵','✨'],pay:['🪙','✨','💰'],close:['🎉','✨','🪙','💛','🎊'],deliver:['📦','✨','🎁'],note:['📌','💛','✨','💜'],box:['📦','✨','➕']};
function burst(kind,x,y){
  if(RM||!document.body.animate)return;
  var set=FX[kind]||FX.pay,n=kind==='close'?26:16;
  x=x==null?innerWidth/2:x;y=y==null?innerHeight*.42:y;
  for(var i=0;i<n;i++){(function(i){
    var e=document.createElement('span');e.className='fx';e.textContent=set[i%set.length];document.body.appendChild(e);
    var a=Math.random()*Math.PI*2,r=80+Math.random()*140,dx=Math.cos(a)*r,dy=Math.sin(a)*r-70,rot=(Math.random()-.5)*560,sc=.7+Math.random()*.8;
    var p=function(px,py,ro,s){return 'translate('+(px-13)+'px,'+(py-13)+'px) rotate('+ro+'deg) scale('+s+')'};
    e.animate([{transform:p(x,y,0,.2),opacity:1},{transform:p(x+dx,y+dy,rot/2,sc),opacity:1,offset:.5},{transform:p(x+dx*1.25,y+dy+170,rot,sc*.8),opacity:0}],
      {duration:1100+Math.random()*600,delay:i*12,easing:'cubic-bezier(.2,.7,.3,1)',fill:'both'}).onfinish=function(){e.remove()};
  })(i)}
}
var ct;function celebrate(pic,text){
  if(RM)return;var c=$('cele');c.querySelector('.cpic').style.backgroundImage=img(pic);c.querySelector('b').textContent=text;
  c.classList.remove('on');void c.offsetWidth;c.classList.add('on');clearTimeout(ct);ct=setTimeout(function(){c.classList.remove('on')},1500);
}
var AVK='dalipay.avatar.';
function meM(){return S.members.filter(function(x){return x.user_id===S.uid})[0]||{}}
function inv(a){return a==='a'?'b':'a'}
function myAv(){var m=meM(),o=other();if(m.avatar)return m.avatar;var l=lsGet(AVK+S.uid);if(l==='a'||l==='b')return l;if(o&&o.avatar)return inv(o.avatar);return null}
function avOf(id){var m=myAv();if(id===S.uid)return m||'a';return m?inv(m):(((S.members.filter(function(x){return x.user_id===id})[0])||{}).avatar||'b')}
function react(which,emoji,anim){
  var el=$(which==='me'?'avMe':'avOther');if(!el||RM)return;anim=anim||'jump';
  el.classList.remove('jump','shake','spin');void el.offsetWidth;el.classList.add(anim);setTimeout(function(){el.classList.remove(anim)},1000);
  if(emoji){var b=document.createElement('span');b.className='bub';b.textContent=emoji;el.parentNode.appendChild(b);setTimeout(function(){b.remove()},1600)}
}
function reactAll(list){(list||[]).forEach(function(r,i){setTimeout(function(){react(r[0],r[1],r[2])},180+i*160)})}
function reportsFor(id){return S.msgs.filter(function(m){return m.debt_id===id&&m.kind==='message'&&!m.read_at})}
function memberOf(id){return S.members.filter(function(x){return x.user_id===id})[0]||{}}
function hop(el){el.classList.remove('hop');void el.offsetWidth;el.classList.add('hop')}
var splashDone=false,entered=false;
function maybeShow(){if(splashDone&&entered)$('app').classList.add('show')}

function fail(e,pic){toast(e&&e.message?e.message:String(e),pic||'delprod')}
function openSheet(pic,title,body){
  $('sheet').innerHTML='<div class="grab"></div><div class="hd"><div class="pic" style="background-image:'+img(pic)+'"></div><h3>'+esc(title)+'</h3></div>'+body;
  $('scrim').classList.add('on');$('sheet').classList.add('on');$('sheet').scrollTop=0;
}
function closeSheet(){$('scrim').classList.remove('on');$('sheet').classList.remove('on')}
$('scrim').onclick=closeSheet;
function busy(btn,on){if(!btn)return;btn.disabled=on;btn.style.opacity=on?.6:1}
function guard(btn,fn){return function(){if(btn.disabled)return;busy(btn,true);Promise.resolve().then(fn).then(function(){busy(btn,false)},function(e){busy(btn,false);fail(e)})}}

/* ---------- data model ---------- */
function nm(id){var m=S.members.filter(function(x){return x.user_id===id})[0];return m?m.display_name:'—'}
function other(){return S.members.filter(function(x){return x.user_id!==S.uid})[0]||null}
function dview(d){
  var list=S.pays.filter(function(p){return p.debt_id===d.id});
  var sum=r2(list.reduce(function(s,p){return s+Number(p.amount)},0)),amt=r2(d.amount);
  var done=d.status==='paid'||sum>=amt;
  return {d:d,amt:amt,paid:done?amt:sum,rem:done?0:r2(amt-sum),done:done,pays:list};
}
function snapshot(){return {mem:S.mem,members:S.members,debts:S.debts,pays:S.pays,prods:S.prods,msgs:S.msgs}}
function cacheSave(){if(S.uid)lsSet(CACHE_PREFIX+S.uid,snapshot())}

/* ---------- render ---------- */
function render(){
  var me=S.uid;
  $('whoBtn').innerHTML=S.mem?('👤 '+esc(nm(me))+' ▾<i class="dot '+(S.sync===true?'ok':S.sync===false?'bad':'')+'"></i>'):'';
  var views=S.debts.map(dview),open=views.filter(function(v){return !v.done});
  var iowe=0,owed=0;
  open.forEach(function(v){if(v.d.debtor_id===me)iowe+=v.rem;else if(v.d.creditor_id===me)owed+=v.rem});
  countTo($('sIowe'),r2(iowe),money);countTo($('sOwed'),r2(owed),money);
  var bal=r2(owed-iowe),b=$('sBal');countTo(b,bal,function(v){v=r2(v);return (v>0?'+':v<0?'−':'')+money(Math.abs(v))});b.className=bal>0?'pos':bal<0?'neg':'';
  $('cDebts').textContent=open.length;
  $('avMe').style.backgroundImage=img('face_'+avOf(me));
  var ot=other();$('avOther').style.backgroundImage=img('face_'+(ot?avOf(ot.user_id):inv(avOf(me))));

  var h='';
  if(S.mem&&S.members.length<2){
    h+='<div class="card invite" id="inviteCard"><div class="row"><div class="dir" style="background:linear-gradient(135deg,#aef0ff,#3aa8ff)">👋</div><div class="grow"><div class="t">החבר עוד לא הצטרף</div><div class="s">שלח לו את קוד ההזמנה: <b style="font-size:15px;letter-spacing:1px">'+esc(S.mem.group.invite_code)+'</b></div></div><span class="badge">שתף</span></div></div>';
  }
  open.sort(function(a,b){return String(b.d.created_at).localeCompare(String(a.d.created_at))}).forEach(function(v,i){
    var mine=v.d.debtor_id===me,pct=Math.min(100,v.paid/v.amt*100);
    h+='<div class="card'+(S.fresh[v.d.id]?' fresh':'')+'" data-debt="'+v.d.id+'" style="animation-delay:'+(i*.04)+'s"><div class="row"><div class="dir '+(mine?'out':'in')+'">'+(mine?'↗':'↙')+'</div>'+
      '<div class="grow"><div class="t">'+(mine?'אני חייב ל'+esc(nm(v.d.creditor_id)):esc(nm(v.d.debtor_id))+' חייב לי')+'</div><div class="s">'+esc(v.d.description||'ללא תיאור')+' · '+fdate(v.d.created_at)+'</div></div>'+
      '<div class="amt '+(mine?'out':'in')+'">'+money(v.rem)+'</div></div>'+
      (v.paid>0?'<div class="bar"><i style="width:'+pct+'%"></i></div><div class="s" style="margin-top:5px">שולם '+money(v.paid)+' מתוך '+money(v.amt)+'</div>':'')+
      (function(){var r=reportsFor(v.d.id);if(!r.length)return '';var sm=r.reduce(function(a,x){return a+Number(x.amount||0)},0);
        return '<div style="margin-top:8px"><span class="badge warn">'+(mine?'⏳ דיווחת על '+money(sm)+' · ממתין לאישור':'💸 '+esc(nm(v.d.debtor_id))+' דיווח על '+money(sm)+' · לאישור שלך')+'</span></div>'})()+'</div>';
  });
  if(!open.length)h+='<div class="empty"><div class="pic" style="background-image:'+img('closeddebt')+'"></div><b>אין חובות פתוחים</b><span>הכול סגור בין שניכם 🎉</span></div>';
  $('debts').innerHTML=h;

  var pend=S.prods.filter(function(p){return !p.delivered});
  $('cProds').textContent=pend.length;
  h='';
  pend.forEach(function(p,i){
    h+='<div class="card'+(S.fresh[p.id]?' fresh':'')+'" data-prod="'+p.id+'" style="animation-delay:'+(i*.04)+'s"><div class="row"><div class="dir" style="background:linear-gradient(135deg,#ffe9a8,#ffb800)">📦</div>'+
      '<div class="grow"><div class="t">'+esc(p.name)+' <span class="badge">×'+esc(p.quantity)+'</span></div><div class="s">'+(p.holder_id?'אצל '+esc(nm(p.holder_id)):'לא צוין אצל מי')+(p.receiver_id?' ← בדרך אל '+esc(nm(p.receiver_id)):'')+'</div></div>'+
      '<span class="badge">ממתין</span></div></div>';
  });
  if(!pend.length)h='<div class="empty"><div class="pic" style="background-image:'+img('product')+'"></div><b>אין מוצרים בדרך</b><span>הכול נמסר 📦</span></div>';
  $('prods').innerHTML=h;

  var hidden=lsGet(HIDE_KEY)||[];
  var notes=S.msgs.filter(function(n){return n.kind==='message'&&n.body&&!n.debt_id&&hidden.indexOf(n.id)<0}).slice(0,8);

/* ---------- loading / sync ---------- */
var loading=false,again=false,qt;
function queueLoad(){clearTimeout(qt);qt=setTimeout(load,250)}
async function load(){
  if(!S.mem)return;
  if(loading){again=true;return}
  loading=true;
  try{
    var d=await call('load',{groupId:S.mem.group.id});
    var had={},fresh={};S.debts.concat(S.prods).forEach(function(x){had[x.id]=1});
    if(S.loadedOnce)d.debts.concat(d.products).forEach(function(x){if(!had[x.id])fresh[x.id]=1});
    S.members=d.members;S.debts=d.debts;S.pays=d.payments;S.prods=d.products;S.msgs=d.messages;
    var newRep=d.messages.filter(function(m){return m.debt_id&&!m.read_at&&m.recipient_id===S.uid&&S.seenRep&&!S.seenRep[m.id]});
    var byOther=S.loadedOnce&&d.debts.concat(d.products).some(function(x){return fresh[x.id]&&x.created_by&&x.created_by!==S.uid});
    S.seenRep=S.seenRep||{};d.messages.forEach(function(m){S.seenRep[m.id]=1});
    S.mem.members=d.members;S.sync=true;S.loadedOnce=true;S.fresh=fresh;cacheSave();
    if(newRep.length){var r0=newRep[0];setTimeout(function(){toast(nm(r0.sender_id)+' דיווח ששילם '+money(r0.amount)+' · לאישור','opendebt');react('other','💸','jump')},300)}
    else if(byOther)setTimeout(function(){react('other','✨','jump')},400);
  }catch(e){S.sync=false;S.lastError=e.message}
  loading=false;render();S.fresh={};
  if(again){again=false;load()}
}
async function act(op,args,okMsg,pic,fx,reactions){
  await call(op,args);
  closeSheet();reactAll(reactions);
  if(fx){setTimeout(function(){burst(fx)},150);
    if(fx==='close')celebrate('closeddebt','החוב נסגר! 🎉');
    else if(fx==='deliver')celebrate('product','המוצר נמסר! 📦');}
  await load();
}

    function need(){var d=$('gName').value.trim();if(!d)toast('יש להזין את השם שלך','opendebt');return d}
    var n=$('gNew');n.onclick=guard(n,async function(){var d=need();if(!d)return;S.mem=await call('createGroup',{name:$('gGroup').value,display:d});await enter()});
    var j=$('gJoin');j.onclick=guard(j,async function(){var d=need();if(!d)return;var code=$('gCode').value.trim();if(!code){toast('יש להזין קוד הזמנה','opendebt');return}S.mem=await call('joinGroup',{code:code,display:d});await enter()});

  $('mHold').onchange=function(){var x=S.members.filter(function(m){return m.user_id!==$('mHold').value})[0];if(x)$('mRec').value=x.user_id};
  var sv=$('mSave');sv.onclick=guard(sv,async function(){
    var n=$('mName').value.trim();if(!n){$('mName').focus();toast('צריך שם למוצר','product');return}
    var row={name:n,quantity:Math.max(1,parseInt($('mQty').value,10)||1),holder_id:$('mHold').value,receiver_id:$('mRec').value};
    if(p.id)await act('updateProduct',{id:p.id,patch:row},'המוצר עודכן','addprod');
    else await act('addProduct',Object.assign({groupId:S.mem.group.id},row),'המוצר נוסף','addprod','box',[['me','📦','jump']]);
  });
  if(p.id){
    var dn=$('mDone');dn.onclick=guard(dn,function(){return act('updateProduct',{id:p.id,patch:{delivered:true}},'המוצר נמסר!','closeddebt','deliver',[['me','📦','jump'],['other','🎁','jump']])});
    var dl=$('mDel');dl.onclick=guard(dl,async function(){if(!dl.dataset.sure){dl.dataset.sure=1;dl.textContent='לחץ שוב למחיקה';return}await act('deleteProduct',{id:p.id},'המוצר נמחק','delprod')});
  }
}
function prodActions(id){
  var p=S.prods.filter(function(x){return x.id===id})[0];if(!p)return;
  openSheet('product',p.name,
    '<div class="s" style="font-size:14px">כמות: <b>'+esc(p.quantity)+'</b><br>נמצא אצל: <b>'+esc(p.holder_id?nm(p.holder_id):'—')+'</b><br>מיועד ל: <b>'+esc(p.receiver_id?nm(p.receiver_id):'—')+'</b></div>'+
    '<button class="cta" id="xDone">סמן כנמסר ✓</button><button class="cta ghost" id="xEdit">עריכה / מחיקה</button>');
  var dn=$('xDone');dn.onclick=guard(dn,function(){return act('updateProduct',{id:p.id,patch:{delivered:true}},'המוצר נמסר!','closeddebt','deliver',[['me','📦','jump'],['other','🎁','jump']])});
  $('xEdit').onclick=function(){prodForm(p)};
}

/* ---------- note (thank-you note, shared with the other user) ---------- */
function noteForm(){
  var o=other();
  if(!o){toast('החבר עוד לא הצטרף. שלח לו את קוד ההזמנה','notes');return}
  openSheet('notes','פתק תודה',
    '<div class="s" style="font-size:13px">הפתק יופיע במסך הבית שלך ושל '+esc(o.display_name)+'</div>'+
    '<label>הטקסט</label><textarea class="inp" id="nTxt" rows="3" maxlength="80" placeholder="תודה על הקפה! ☕"></textarea>'+
    '<button class="cta" id="nSave">נעץ במסך הבית 📌</button>');
  var sv=$('nSave');sv.onclick=guard(sv,async function(){
    var t=$('nTxt').value.trim();if(!t){$('nTxt').focus();return}
    await act('sendNote',{groupId:S.mem.group.id,recipient_id:o.user_id,body:t},'הפתק ננעץ','notes','note',[['me','💌','jump'],['other','💛','jump']]);
  });
}
function noteView(id){
  var n=S.msgs.filter(function(x){return x.id===id})[0];if(!n)return;
  openSheet('notes','פתק מ'+nm(n.sender_id),'<div class="card" style="box-shadow:none;background:#fff8c8;font-weight:800;font-size:17px;line-height:1.4">'+esc(n.body)+'</div><div class="s">'+fdate(n.created_at)+'</div><button class="cta ghost" id="nHide">הסר מהמסך שלי</button>');
  $('nHide').onclick=function(){var h=lsGet(HIDE_KEY)||[];h.push(id);lsSet(HIDE_KEY,h);closeSheet();render()};
}

/* ---------- account ---------- */
function accountSheet(){
  if(!S.mem)return;var m=meM();
  openSheet('settings',nm(S.uid),
    '<div class="s" style="font-size:13px;direction:ltr;text-align:right">'+esc(S.email||'')+'</div><div class="s" style="font-size:13px;margin-top:6px;font-weight:800;color:'+(S.sync===true?'#0b7d4d':'#c01540')+'">'+(S.sync===true?'● מסונכרן עם השרת':'● לא מסונכרן'+(S.lastError?': '+esc(S.lastError):''))+'</div>'+
    '<label>קישור Bit אישי (כדי שיוכלו לשלם לך)</label><input class="inp" id="bLink" type="url" dir="ltr" placeholder="https://www.bitpay.co.il/app/me/..." value="'+esc(m.bit_link||'')+'"><button class="cta" id="bSave" style="margin-top:10px">שמור קישור</button>'+
    '<button class="cta ghost" id="aAv">החלף דמות</button>'+
    '<label>קוד הזמנה לקבוצה "'+esc(S.mem.group.name)+'"</label><div class="amt" style="font-size:24px;text-align:right;letter-spacing:2px">'+esc(S.mem.group.invite_code)+'</div>'+
    '<button class="cta ghost" id="aShare">שתף קוד הזמנה</button><button class="cta ghost" id="aOut" style="color:#e0294d">התנתקות</button>');
  var bs=$('bSave');bs.onclick=guard(bs,async function(){
    var v=$('bLink').value.trim();
    if(v&&!/^https:\/\/\S+$/.test(v)){toast('הקישור צריך להתחיל ב-https://','opendebt');return}
    await act('setProfile',{groupId:S.mem.group.id,patch:{bit_link:v}},v?'קישור ה-Bit נשמר':'קישור ה-Bit הוסר','settings',null,[['me','😎','jump']]);
  });
  $('aAv').onclick=function(){closeSheet();pickAvatar()};
  $('aShare').onclick=function(){call('share',{text:'הצטרף אלי ל-DALI PAY. קוד הזמנה: '+S.mem.group.invite_code}).catch(fail)};
  $('aOut').onclick=signOut;
}
function hText(a){
  var d=a.data||{},who=esc(a.actor_id?nm(a.actor_id):'מערכת'),desc=d.description?' · '+esc(d.description):'';
  var dir=d.creditor_id?esc(nm(d.debtor_id))+' חייב ל'+esc(nm(d.creditor_id))+' ':'';
  var prod=d.name?esc(d.name)+(d.quantity>1?' ×'+d.quantity:''):'';
  switch(a.kind){
    case 'debt_add':return ['➕',who+' הוסיף חוב',dir+money(d.amount)+desc];
    case 'debt_edit':return ['✏️',who+' ערך חוב',dir+(d.old_amount!=null&&Number(d.old_amount)!==Number(d.amount)?'מ-'+money(d.old_amount)+' ל-'+money(d.amount):money(d.amount))+desc];
    case 'payment':return ['💰',who+' אישר '+(Number(d.amount)<Number(d.debt_amount)?'תשלום חלקי':'תשלום')+' של '+money(d.amount),dir+desc];
    case 'payment_cancel':return ['↩️',who+' ביטל תשלום של '+money(d.amount),dir+desc];
    case 'debt_closed':return ['✅','החוב נסגר ('+who+')',dir+money(d.amount)+desc];
    case 'debt_reopened':return ['🔓',who+' פתח מחדש חוב',dir+money(d.amount)+desc];
    case 'debt_delete':return ['🗑️',who+' מחק חוב',dir+money(d.amount)+desc];
    case 'product_add':return ['📦',who+' הוסיף מוצר',prod];
    case 'product_edit':return ['✏️',who+' ערך מוצר',prod];
    case 'product_delivered':return ['🎁',who+' סימן שנמסר',prod];
    case 'product_delete':return ['🗑️',who+' מחק מוצר',prod];
  }
  return ['•',who,esc(a.kind)];
}
async function historySheet(){
  if(!S.mem)return;
  openSheet('history','היסטוריה','<div id="hList"><div class="s">טוען…</div></div>');
  try{
    var rows=await call('history',{groupId:S.mem.group.id}),h='',day='';
    if(!rows.length)h='<div class="s">עוד אין פעולות</div>';
    rows.forEach(function(a,i){
      var dd=fdate(a.created_at);if(dd!==day){day=dd;h+='<div class="hday">'+dd+'</div>'}
      var t=hText(a),tm=new Date(a.created_at);
      h+='<div class="hrow" style="animation-delay:'+Math.min(i*.03,.6)+'s"><div class="hi">'+t[0]+'</div><div class="grow"><div class="ht">'+t[1]+'</div><div class="hs">'+t[2]+' · '+pad(tm.getHours())+':'+pad(tm.getMinutes())+'</div></div></div>';
    });
    if($('hList'))$('hList').innerHTML=h;
  }catch(e){if($('hList'))$('hList').innerHTML='<div class="s" style="color:#c01540;font-weight:800">'+esc(e.message)+'</div>'}
}

/* ---------- events ---------- */
$('bDebt').onclick=function(){hop(this);debtForm()};
$('bProd').onclick=function(){hop(this);prodForm()};
$('bNote').onclick=function(){hop(this);noteForm()};
$('debts').onclick=function(e){
  if(e.target.closest('#inviteCard')){accountSheet();return}
  var c=e.target.closest('[data-debt]');if(c)debtActions(c.dataset.debt)};
$('prods').onclick=function(e){var c=e.target.closest('[data-prod]');if(c)prodActions(c.dataset.prod)};
$('notesWrap').onclick=function(e){var c=e.target.closest('[data-note]');if(c)noteView(c.dataset.note)};
$('whoBtn').onclick=accountSheet;
$('histBtn').onclick=historySheet;
$('avMe').onclick=function(e){e.stopPropagation();react('me',['😎','🤑','😅','🙃','😇'][Math.floor(Math.random()*5)],['jump','spin','shake'][Math.floor(Math.random()*3)])};
$('avOther').onclick=function(e){e.stopPropagation();react('other',['😄','🤔','😏','🙈','🥳'][Math.floor(Math.random()*5)],['jump','spin','shake'][Math.floor(Math.random()*3)])};
document.addEventListener('visibilitychange',function(){if(!document.hidden)queueLoad()});

render();boot();
setTimeout(function(){$('splash').classList.add('out');setTimeout(function(){splashDone=true;maybeShow()},window.DP_SPLASH_MS?0:350)},window.DP_SPLASH_MS||2700);
})();

</script>
